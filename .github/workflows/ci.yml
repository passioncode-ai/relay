name: ci

# The nightly batch (operator's CI policy of 2026-09-25, org-index docs/CI-BATCHING.md): 23:00 Europe/Warsaw, and
# a manual dispatch for an urgent candidate, `gh workflow run ci.yml --ref <branch>`. The merge gate is
# `npm run check`, run by the session that merges (AGENTS.md → Commands).
on:
  schedule:
    - cron: '0 21 * * *'   # 23:00 Warsaw in summer time
    - cron: '0 22 * * *'   # 23:00 Warsaw in winter time
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
